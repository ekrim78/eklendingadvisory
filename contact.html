<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Eugene Krimkevich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Epilogue:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1C1917; --ink-mid: #44403C; --ink-soft: #78716C; --ink-faint: #A8A29E;
    --paper: #FAF7F2; --paper-warm: #F2EDE4; --paper-rule: #E5DDD3;
    --gold: #B5894A; --gold-light: #D4AA72;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: 'Epilogue', sans-serif; font-weight: 300; line-height: 1.6; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  nav { position: sticky; top: 0; z-index: 100; background: var(--paper); border-bottom: 1px solid var(--paper-rule); height: 60px; display: flex; align-items: center; padding: 0 48px; justify-content: space-between; }
  .nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 500; }
  .nav-brand span { color: var(--gold); }
  .nav-links { display: flex; gap: 32px; list-style: none; }
  .nav-links a { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); transition: color 0.15s; }
  .nav-links a:hover, .nav-links a.active { color: var(--ink); }
  .nav-cta { background: var(--ink); color: var(--paper) !important; padding: 8px 18px; }
  .nav-hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
  .nav-hamburger span { display: block; width: 22px; height: 1.5px; background: var(--ink); }
  .page { max-width: 860px; margin: 0 auto; padding: 64px 48px 80px; }
  .eyebrow { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }

  .page-header { padding-bottom: 36px; border-bottom: 1px solid var(--ink); margin-bottom: 48px; }
  .page-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 500; line-height: 1.05; }

  /* FORM */
  .contact-form { margin-bottom: 48px; max-width: 600px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }
  .form-group input, .form-group textarea { width: 100%; background: var(--paper-warm); border: 1px solid var(--paper-rule); padding: 12px 16px; font-family: 'Epilogue', sans-serif; font-size: 13px; font-weight: 300; color: var(--ink); outline: none; transition: border-color 0.15s; -webkit-appearance: none; border-radius: 0; }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--ink-soft); }
  .form-group textarea { min-height: 150px; resize: vertical; }
  .form-submit { background: var(--ink); color: var(--paper); border: none; font-family: 'Epilogue', sans-serif; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 12px 24px; cursor: pointer; transition: background 0.15s; }
  .form-submit:hover { background: var(--ink-mid); }

  /* CONTACT LINKS */
  .contact-links { display: flex; gap: 12px; flex-wrap: wrap; padding-top: 32px; border-top: 1px solid var(--paper-rule); }
  .btn { display: inline-block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 11px 22px; transition: all 0.15s; }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover { background: var(--ink-mid); }
  .btn-outline { border: 1px solid var(--paper-rule); color: var(--ink-soft); }
  .btn-outline:hover { border-color: var(--ink-soft); color: var(--ink); }

  footer { border-top: 1px solid var(--paper-rule); padding: 28px 48px; display: flex; justify-content: space-between; align-items: center; }
  .footer-name { font-family: 'Cormorant Garamond', serif; font-size: 14px; color: var(--ink-soft); }
  .footer-links { display: flex; gap: 24px; }
  .footer-links a { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); transition: color 0.15s; }
  .footer-links a:hover { color: var(--ink); }

  @media (max-width: 680px) {
    nav { padding: 0 24px; }
    .nav-links { display: none; position: absolute; top: 60px; left: 0; right: 0; background: var(--paper); border-bottom: 1px solid var(--paper-rule); flex-direction: column; padding: 20px 24px; gap: 16px; }
    .nav-links.open { display: flex; }
    .nav-hamburger { display: flex; }
    .page { padding: 40px 24px 64px; }
    .page-header h1 { font-size: 32px; }
    .form-row { grid-template-columns: 1fr; }
    footer { flex-direction: column; gap: 16px; text-align: center; padding: 24px; }
  }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-brand">Eugene Krimkevich <span>·</span> Embedded Lending Advisory</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="resume.html">Resume</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
    <li><a href="https://calendar.app.google/yLQr5Wng1prbT4F9A" target="_blank" class="nav-cta">Book a call</a></li>
  </ul>
  <div class="nav-hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')">
    <span></span><span></span><span></span>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <div class="eyebrow">Contact</div>
    <h1>Get in touch</h1>
  </div>

  <form class="contact-form" action="https://formspree.io/f/xaqkegod" method="POST">
    <div class="form-row">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@company.com">
      </div>
    </div>
    <div class="form-group">
      <label for="message">What are you working on?</label>
      <textarea id="message" name="message" required placeholder="Tell me about your program — where you are in the process and what you're trying to figure out."></textarea>
    </div>
    <button type="submit" class="form-submit">Send message</button>
  </form>

  <div class="contact-links">
    <a href="https://calendar.app.google/yLQr5Wng1prbT4F9A" target="_blank" class="btn btn-primary">Book a discovery call</a>
    <a href="https://www.linkedin.com/in/eugenekrimkevich/" target="_blank" style="display: flex; align-items: center; gap: 5px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); transition: color 0.15s;" onmouseover="this.style.color='var(--ink)'" onmouseout="this.style.color='var(--ink-soft)'"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>LinkedIn</a>
  </div>
</div>

<footer>
  <div class="footer-name">Eugene Krimkevich — Embedded Lending Advisory</div>
  <div class="footer-links">
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="resume.html">Resume</a>
    <a href="contact.html">Contact</a>
  </div>
</footer>
</body>
</html>
